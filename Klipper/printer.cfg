#  printer.cfg —— 0xC0FFEE_ZY 3D打印机主板 · Klipper 配置
# =====================================================================
#
#  作者：0xC0FFEE_ZY
#  时间：2026.11.6
#  主页：https://github.com/0xC0FFEE-ZY
#  项目：https://github.com/0xC0FFEE-ZY/3D_Printer-Hardware-and-Firmware
#  视频教程链接：
#    硬件教程：https://www.bilibili.com/video/BV1Lnev6LE89/?share_source=copy_web&vd_source=38dbac9c450e5f6d729a698d323434c2
#    软件教程：后续发布时本段会替换为链接
#
#  简介：
#   本文件是 0xC0FFEE_ZY 3D打印机主板的 Klipper 配置文件（printer.cfg）。
#   本 3D打印机项目 兼容 Klipper、Marlin 两种固件，均已适配完毕，用户可根据喜好选择。
#   基于 Klipper 固件（Copyright (C) 2016-2026 Kevin O'Connor <kevin@koconnor.net>，GPL-3.0）。
#   本文件遵循 GPL-3.0 许可；引用、转载或分发须保留本版权声明与署名。
#
#  硬件概况：
#    · 结构：UM架构 X/X2、Y/Y2、Z/Z2 同轴双电机
#    · 驱动：7 × TMC2209（UART 单线软件串口）
#    · 回零：X/Y 用 TMC2209 DIAG 无传感器回零（StallGuard4），Z 用 3DTouch 探针
#    · 步进：XYZ 为 0.9°（400 步/转），挤出机为 1.8°（200 步/转）
#
#    运行环境：Klipper @ Mainsail OS（树莓派）
#

# =====================================================================
#  下位机固件编译 (make menuconfig) 注意
# =====================================================================
# 选项具体内容可参考开源仓库Klipper文件夹内的 make menuconfig 图片
#
#  在树莓派等上位机上编译（cd ~/klipper && make menuconfig）
#
#  1. 勾选「Enable extra low-level configuration options」
#  2. Micro-controller Architecture ：STMicroelectronics STM32
#  3. Processor model               ：STM32F407
#  4. Bootloader offset             ：No bootloader（ST-Link 直接烧到 0x08000000）
#  5. Clock Reference               ：8 MHz crystal   硬件电路中晶振为 8MHz
#  6. Communication interface       ：Serial (on USART3 PD9/PD8)   ← PD8=TX、PD9=RX
#  7. Baud rate                     ：250000（与 [mcu] 默认波特率一致）
#
#  说明：
#  · 编译产物 ~/klipper/out/klipper.bin，用 ST-Link 烧到 0x08000000。
#
# =====================================================================


[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0     # 主机（树莓派）连主板的串口路径。
#   ↑ CH340 设备路径。执行 ls /dev/serial/by-id/* 找到实际值替换
restart_method: command                                      # 重启固件的方式，用命令重启（软复位）

[printer]
kinematics: cartesian                            # 笛卡尔运动学（X/Y/Z 三轴垂直）
max_velocity: 300                                # X/Y 最大速度 300mm/s
max_accel: 3000                                  # X/Y 最大加速度 3000mm/s²
max_z_velocity: 5                                # Z 最大速度 5mm/s（丝杆）
max_z_accel: 100                                 # Z 最大加速度
square_corner_velocity: 5.0                      # 转角平滑速度（拐弯不减速到 0 的阈值）


# =====================================================================
#  X 轴  (双电机: 主 X + 副 X2；DIAG 无传感器回零挂在主电机)
# =====================================================================
[stepper_x]
step_pin: PC13                                   # X轴 步进脉冲引脚
dir_pin: PE4                                     # X轴 方向引脚
enable_pin: !PC15                                # X轴 使能引脚
rotation_distance: 40                            # GT2 20齿；400步×16细分/160steps_per_mm=40 ,X 电机转一圈 X 轴走 40mm
microsteps: 16                                   # 16 细分
full_steps_per_rotation: 400                     # 步距角 0.9° 电机
endstop_pin: tmc2209_stepper_x:virtual_endstop   # 用 TMC2209 的 DIAG 信号当限位（无传感器回零）
position_endstop: 0                              # 限位触发点对应坐标 0
position_min: 0                                  # X轴 行程范围 0~250mm
position_max: 250                                # X轴 行程范围 0~250mm
homing_speed: 50                                 # 回零速度 50mm/s
homing_retract_dist: 0                           # 不设置回退距离
homing_positive_dir: false                       # 回零方向

[tmc2209 stepper_x]
uart_pin: PC14                                   # X轴 TMC2209 的 UART 通信引脚（单线软件串口）
diag_pin: ^PE3                                   # X轴 DIAG 引脚，^为内部上拉
driver_SGTHRS: 140                               # X轴 回零时灵敏度阈值，越大越灵敏，需通过实际测试得到数值
sense_resistor: 0.110                            # 电机驱动电流采样电阻，用于计算实际电流，和电机驱动硬件设计对应
run_current: 1.0                                 # 运行电流（1A）
hold_current: 0.5                                # 静止保持电流（0.5A）
stealthchop_threshold: 0                         # 打印时电机驱动进入 SpreadCycle 模式；回零时 Klipper 自动切 StealthChop（StallGuard4 只在 StealthChop 下工作）
interpolate: True                                # 微步插值（把 16 细分插成 256，运行更平滑）

[stepper_x1]
step_pin: PE0                                    # X轴 副电机引脚
dir_pin: PB9                                     # X轴 副电机方向引脚
enable_pin: !PE2                                 # X轴 副电机使能引脚
rotation_distance: 40                            # GT2 20齿；400步×16细分/160steps_per_mm=40 ,X 电机转一圈 X 轴走 40mm
microsteps: 16                                   # 16 细分
full_steps_per_rotation: 400                     # 步距角 0.9° 电机，必须与主 X 一致

[tmc2209 stepper_x1]
uart_pin: PE1                                    # X轴 副电机 TMC2209 的 UART 通信引脚（单线软件串口）
# 单路 DIAG：副驱动 X2 的 DIAG 不参与回零
sense_resistor: 0.110                            # 电机驱动电流采样电阻，用于计算实际电流，和电机驱动硬件设计对应
run_current: 1.0                                 # X 轴副电机运行电流（与主电机一致）
hold_current: 0.5                                # X 轴副电机静止保持电流（与主电机一致）
stealthchop_threshold: 0
interpolate: True


# =====================================================================
#  Y 轴  (双电机: 主 Y + 副 Y2)
# =====================================================================
[stepper_y]
step_pin: PB6                                    # Y轴 步进脉冲引脚
dir_pin: !PB5                                    # Y轴 方向引脚
enable_pin: !PB8                                 # Y轴 使能引脚
rotation_distance: 40                            # GT2 20齿；400步×16细分/160steps_per_mm=40 ,Y 电机转一圈 Y 轴走 40mm
microsteps: 16                                   # 16 细分
full_steps_per_rotation: 400                     # 步距角 0.9° 电机
endstop_pin: tmc2209_stepper_y:virtual_endstop   # 用 TMC2209 的 DIAG 信号当限位（无传感器回零）
position_endstop: 0                              # 限位触发点对应坐标 0
position_min: 0                                  # Y轴 行程范围 0~255mm
position_max: 255                                # Y轴 行程范围 0~255mm
homing_speed: 50                                 # 回零速度 50mm/s
homing_retract_dist: 0                           # 不设置回退距离
homing_positive_dir: false                       # 回零方向

[tmc2209 stepper_y]
uart_pin: PB7                                    # Y轴 TMC2209 的 UART 通信引脚（单线软件串口）
diag_pin: ^PB4                                   # DIAG 引脚，^为内部上拉
driver_SGTHRS: 140                               # Y轴 回零时灵敏度阈值，越大越灵敏，需通过实际测试得到数值
sense_resistor: 0.110                            # Y轴 电机驱动电流采样电阻，用于计算实际电流，和电机驱动硬件设计对应
run_current: 1.0                                 # Y轴 运行电流（1A）
hold_current: 0.5                                # Y轴 静止保持电流（0.5A）
stealthchop_threshold: 0                         # 打印时电机驱动进入 SpreadCycle 模式；回零时 Klipper 自动切 StealthChop（StallGuard4 只在 StealthChop 下工作）
interpolate: True                                # 微步插值（把 16 细分插成 256，运行更平滑）

[stepper_y1]
step_pin: PD6                                    # Y轴 副电机引脚
dir_pin: PD5                                     # Y轴 副电机方向引脚
enable_pin: !PB3                                 # Y轴 副电机使能引脚
rotation_distance: 40                            # GT2 20齿；400步×16细分/160steps_per_mm=40 ,Y 电机转一圈 Y 轴走 40mm
microsteps: 16                                   # 16 细分
full_steps_per_rotation: 400                     # 步距角 0.9° 电机，必须与主 Y 一致

[tmc2209 stepper_y1]
uart_pin: PD7                                    # Y轴 副电机 TMC2209 的 UART 通信引脚（单线软件串口）
# 单路 DIAG：副驱动 Y2 的 DIAG 不参与回零
sense_resistor: 0.110                            # Y轴 副电机驱动电流采样电阻，用于计算实际电流，和电机驱动硬件设计对应
run_current: 1.0                                 # Y轴 副电机运行电流（与主电机一致）
hold_current: 0.5                                # Y轴 副电机静止保持电流（与主电机一致）
stealthchop_threshold: 0                         # Y轴 副电机回零时的 StealthChop 阈值
interpolate: True                                # Y轴 副电机微步插值


# =====================================================================
#  Z 轴  (双电机: 主 Z + 副 Z2；用 3DTouch 探针回零)
# =====================================================================
[stepper_z]
step_pin: PD2                               # Z轴 步进脉冲引脚
dir_pin: PD1                                # Z轴 方向引脚
enable_pin: !PD4                            # Z轴 使能引脚
rotation_distance: 2                        # 2mm 导程丝杆；400步×16细分/3200steps_per_mm=2
microsteps: 16                              # 16 细分
full_steps_per_rotation: 400                # 步距角 0.9° 电机
endstop_pin: probe:z_virtual_endstop        # Z轴 探针限位引脚
homing_positive_dir: false                  # 回零方向
position_min: 0                             # Z轴 行程范围 0~200mm
position_max: 200                           # Z轴 行程范围 0~200mm
homing_speed: 4                             # 回零速度 4mm/s
second_homing_speed: 2                      # 二次回零速度 2mm/s
homing_retract_dist: 3                      # 第一次回零触发后退距离 3mm（探针回零后，Z 轴退开 3mm 再做二次回零）

[tmc2209 stepper_z]
uart_pin: PD3                               # Z轴 TMC2209 的 UART 通信引脚（单线软件串口）
sense_resistor: 0.110                       # Z轴 电机驱动电流采样电阻，用于计算实际电流，和电机驱动硬件设计对应
run_current: 1.0                            # Z轴 运行电流（1A）
stealthchop_threshold: 0                    # Z轴 回零时的 StealthChop 阈值
interpolate: True                           # Z轴 微步插值

[stepper_z1]
step_pin: PC10                              # Z2轴 电机引脚
dir_pin: PA15                               # Z2轴 电机方向引脚
enable_pin: !PC12                           # Z2轴 电机使能引脚
rotation_distance: 2                        # 2mm 导程丝杆；400步×16细分/3200steps_per_mm=2
microsteps: 16                              # 16 细分
full_steps_per_rotation: 400                # 0.9° 电机，必须与主 Z 一致

[tmc2209 stepper_z1]
uart_pin: PC11
sense_resistor: 0.110
run_current: 1.0                            # Z2轴 运行电流（1A）
stealthchop_threshold: 0                    # Z2轴 回零时的 StealthChop 阈值
interpolate: True                           # Z2轴 微步插值
#   Z_MIN_PIN PA8 是机械限位(紧急停机)，本配置用探针回零，未启用


# =====================================================================
#  挤出机 E0  (1.8° 电机)
# =====================================================================
[extruder]
step_pin: PD15                              # 挤出机 步进脉冲引脚
dir_pin: !PD14                              # 挤出机 方向引脚
enable_pin: !PC9                            # 挤出机 使能引脚
rotation_distance: 5.694                    # 200步×16细分/562steps_per_mm=5.694（含减速比）
microsteps: 16                              # 16 细分
full_steps_per_rotation: 200                # 挤出机是 1.8° 电机
nozzle_diameter: 0.400                      # 喷嘴直径 0.4mm
filament_diameter: 1.750                    # 耗材直径 1.75mm
heater_pin: PC7                             # 热端加热引脚
sensor_type: Generic 3950                   # 热敏电阻型号：B3950 100K NTC
sensor_pin: PC0                             # 热敏电阻引脚
control: watermark                          # 它是简单的「开关控制」（Klipper 的默认值）。
# 每台机器参数不同，这里先保留默认的 watermark（开关控制）。使用 PID 模式需要经过调试，
# 软件会在文件末尾自动生成 #*# 覆盖块。具体操作可参考配套教程视频
min_temp: 5                                 # 最低安全温度（不可低于 5℃）
max_temp: 275                               # 最高安全温度（不可超过275℃）
min_extrude_temp: 170                       # 最低挤出温度（防止冷挤出）

[tmc2209 extruder]
uart_pin: PC8                               # 挤出机 TMC2209 的 UART 通信引脚（单线软件串口）
sense_resistor: 0.110                       # 挤出机 电机驱动电流采样电阻，用于计算实际电流，和电机驱动硬件设计对应
run_current: 1.2                            # 挤出机 运行电流（1.2A）
stealthchop_threshold: 0                    # 挤出机 回零时的 StealthChop 阈值
interpolate: True                           # 挤出机 微步插值


# =====================================================================
#  热床
# =====================================================================
[heater_bed]
heater_pin: PC6                             # 热床加热引脚
sensor_type: Generic 3950                   # 热敏电阻型号：B3950 100K NTC
sensor_pin: PC2                             # 热敏电阻引脚
control: watermark                          # 它是简单的「开关控制」（Klipper 的默认值）。
# 每台机器参数不同，这里先保留默认的 watermark（开关控制）。使用 PID 模式需要经过调试，
# 软件会在文件末尾自动生成 #*# 覆盖块。具体操作可参考配套教程视频
min_temp: 5                                 # 最低安全温度（不可低于 5℃）
max_temp: 150                               # 最高安全温度（不可超过150℃）


# =====================================================================
#  风扇
# =====================================================================
# 模型冷却风扇
[fan]
pin: PE5                                    # 模型冷却风扇引脚
kick_start_time: 0.5                        # 启动瞬间给 0.5s 全速（克服风扇起转死区）
off_below: 0.13                             # 低于 13% 功率时关闭风扇

# 喉管散热风扇
[heater_fan hotend_fan]
pin: PE6                                    # 喉管散热风扇引脚
heater: extruder                            # 喉管散热风扇随热端加热器工作
heater_temp: 50.0                           # 喉管散热风扇启动温度阈值（50℃以上才开）
fan_speed: 0.2                              # 喉管风扇功率（0~1）。我的风扇功率大，所以设了 0.2，按需调节。

# 腔体风扇（未启用，按需开启）
[fan_generic chamber_fan]
pin: PD12                                   # 腔体风扇引脚


# =====================================================================
#  3DTouch (BLTouch 类探针) —— Z 轴回零 / 调平
# =====================================================================
[bltouch]
sensor_pin: ^PA5                            # Z 轴探针信号引脚
control_pin: PA6                            # 舵机收放引脚
x_offset: -32                               # 探针在喷嘴左侧 32mm（拿尺子量你的打印机实际值）
y_offset: -10                               # 探针在喷嘴后方 10mm（拿尺子量你的打印机实际值）
z_offset: 2.0                               # Z 轴偏移量 2.0（调试获取最合适数值。探针触发时喷嘴离床 2mm，探针比喷嘴低 2mm）
                                            # 方向：偏大=喷嘴压低(撞床)、偏小=喷嘴抬高(离开热床)，最终值以首层为准；可用 PROBE_CALIBRATE 精校
speed: 4.0                                  # 喷嘴相对床接近的速度
lift_speed: 4.0                             # 喷嘴相对床远离的速度
samples: 2                                  # 探针触发采样次数（2次取平均值，减少误差）

# 对应 Marlin 5×5 双线性调平
[bed_mesh]
speed: 100                                  # 探针移动速度 100mm/s
horizontal_move_z: 5                        # 探针移动时 Z 轴抬高 5mm（防止撞床）
mesh_min: 10, 10                            # 网格起点坐标（探针可及范围）
mesh_max: 210, 240                          # 网格终点坐标
probe_count: 5, 5                           # 网格点数 5×5=25 个探测点


# =====================================================================
#  双 Z 倾斜对齐（对应 Marlin G34 / Z_STEPPER_AUTO_ALIGN）
#  命令：Z_TILT_ADJUST —— 在 G28 之后执行，先对齐床，再做 bed_mesh
#  z_positions = 两根 Z 丝杆位置（喷嘴坐标，实测：左 -62 / 右 290，Y=137）
#  points      = 探测点（喷嘴坐标，由 Marlin 探针坐标换算：
#                探针(24.5,127)→喷嘴(56.5,137)；探针(212.5,127)→喷嘴(244.5,137)）
# =====================================================================
[z_tilt]
z_positions:
    -62, 137                       # 左 Z 丝杆位置坐标  注意：这是我的打印机的实测参数，不一定与你们相同！
    290, 137                       # 右 Z 丝杆位置坐标  注意：这是我的打印机的实测参数，不一定与你们相同！
points:
    56.5, 137                      # 左探测点坐标
    244.5, 137                     # 右探测点坐标
speed: 50
horizontal_move_z: 5
retries: 5                         # 迭代对齐次数（探测点在丝杆内侧、有杠杆，需多次迭代收敛）
retry_tolerance: 0.0075            # 左右高度差容差(mm)，收敛到小于此值即停止


# =====================================================================
#  回零：X/Y 满电流无传感器回零（单路 DIAG，只接主驱动的 DIAG），不降流。
#  Z 轴用 Klipper 默认的 [safe_z_home]：先抬 Z → 移床中心 → 探针回零。
#  ⚠ SGTHRS=140 是满电流(1.0A)下实测可用的值（X/Y 都是 140），只配在主驱动上。
#    副驱动(X1/Y1)的 DIAG 已从 MCU 断开（单路 DIAG），不需要也不应再 arm。
# =====================================================================
[safe_z_home]
home_xy_position: 125, 127.5       # 探针回零前，X/Y 先移到床中心
speed: 50                          # 移到床中心的速度 50mm/s
z_hop: 10                          # 回零前热床 让出空间（床下降）
z_hop_speed: 5                     # 抬 Z 速度 5mm/s

# 自定义回零 HOME 宏：X 回零后回退，再进行 Y 回零。（你可以试试在 Mainsail OS 控制台先后发 G28 和 HOME，看看差别）
[gcode_macro HOME]
gcode:
    G28 X                          # 回零 X（触发一次 z_hop）
    G91
    G1 X5 F3000                    # X 回退 5mm
    G90
    G28 Y Z                        # 回零 Y + Z（再触发一次 z_hop，共两次）

# =====================================================================
#  常用运行支持
# =====================================================================
[idle_timeout]
timeout: 120                       # 2 分钟无操作后执行默认动作：M84 释放电机 + TURN_OFF_HEATERS 关加热

[virtual_sdcard]
path: ~/printer_data/gcodes        # Mainsail OS 的 gcode 目录（Mainsail 上传文件放这里，path 必须与它一致，否则报 Unable to open file）

# 暂停 / 恢复 / 取消打印（Mainsail 按钮依赖，必须定义，否则报 "没有定义"）
[pause_resume]

# 下方三个宏（PAUSE/RESUME/CANCEL_PRINT）给 Mainsail 按钮用，核心是 rename_existing 接管内置命令、SAVE_GCODE_STATE/RESTORE_GCODE_STATE 保存恢复位置。
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    SAVE_GCODE_STATE NAME=PAUSE_state
    G91
    G1 Z10 F300                    # 抬 Z 10mm（UM：床下降，远离喷头）
    G90
    G1 X5 Y5 F3000                 # 移到角落安全位置

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    G91
    G1 E1 F2100                    # 回抽补偿 1mm（抵消暂停时料的回流）
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS               # 关所有加热器
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F300
    G90

[display_status]

[respond]


